spring.datasource.url=${FINANCEMANAGER_DB_URL}
spring.datasource.username=${FINANCEMANAGER_DB_USERNAME}
spring.datasource.password=${FINANCEMANAGER_DB_PASSWORD}

# HikariCP Configuration for Serverless PostgreSQL (Neon)
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10